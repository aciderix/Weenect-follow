name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Ensure .env file exists
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Ensure debug keystore exists
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Restoring keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Generating fresh debug keystore..."
            keytool -genkey -v -keystore debug.keystore \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias androiddebugkey -storepass android \
              -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-artifacts
          find app/build/outputs/apk/debug/ -type f -name "*.apk" -exec cp {} build-artifacts/AlerteResidents-debug.apk \;

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlerteResidents-APK
          path: build-artifacts/AlerteResidents-debug.apk
          retention-days: 30
