name: Build Windows app

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Tests (core + Windows app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Run tests
        run: |
          chmod +x gradlew
          xvfb-run ./gradlew :core:test :desktop:test --stacktrace
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-report
          path: |
            core/build/reports/tests/test/
            desktop/build/reports/tests/test/
          retention-days: 14

  package:
    name: Windows installer (MSI)
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Build MSI
        run: ./gradlew :desktop:packageMsi --stacktrace
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: AlerteResidents-Windows
          path: desktop/build/compose/binaries/main/msi/*.msi
          retention-days: 30
